server.port=8080

# H2 File-based Database Persistence (Persiste em ./data/matriculasdb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/matriculasdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (min 256 bits for HS256)
app.jwt.secret=9a3f2c5d8e7b1a4f0d6c8e2b5a7d9f1e3c5a7b9d1e3f5a7b9c1d3e5f7a9b1c3d
app.jwt.expiration-ms=86400000

# Logging
logging.level.br.pucminas.matriculas=INFO
