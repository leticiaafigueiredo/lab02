server.port=8080

# H2 In-Memory / File Database
spring.datasource.url=jdbc:h2:mem:matriculasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (min 256 bits for HS256)
app.jwt.secret=9a3f2c5d8e7b1a4f0d6c8e2b5a7d9f1e3c5a7b9d1e3f5a7b9c1d3e5f7a9b1c3d
app.jwt.expiration-ms=86400000

# Logging
logging.level.br.pucminas.matriculas=INFO
